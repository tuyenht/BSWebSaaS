name: CI

# When it runs (Actions minutes are billed, so nothing runs twice for the same change):
#   - pull request to main: the jobs its changed paths call for (see the `changes` job);
#   - every night on main's head: every job. This is the run that catches what per-PR scoping
#     cannot — two pull requests green alone and red together, a path wrongly classed as a
#     document, a dependency or runner image that moved;
#   - by hand, on any branch or tag: every job (`gh workflow run ci.yml --ref <branch>`).
# A merge to main starts no run of its own. A deploy needs a full run on the exact commit
# (docs/runbooks/prod-deploy.md).
on:
  pull_request:
    branches: [main]
  schedule:
    # 02:30 in Vietnam (UTC+7). Off the hour: GitHub delays schedules queued at :00.
    - cron: '30 19 * * *'
  workflow_dispatch:

# A newer push to a pull request cancels that pull request's older run. Nightly and manual runs
# are never cancelled by a newer one: each is the evidence for one commit.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26 from 19/10/2026,
# which would change the OS under every job (chrome, setup-php, postgres service) in one silent
# jump. Move the pin deliberately, in its own commit, once a run on the new image is green.
#
# Every job has a timeout: the default is six hours, all of them billed if a step hangs.
jobs:
  # Pull requests only: says which of the jobs below this change needs. Plain git on the checked-out
  # merge commit — no third-party action.
  #   code  = 'false' → only documents changed: nothing below runs, and this job is the green result.
  #   pages = 'false' → nothing that can change a rendered page: the `cwv` job is skipped.
  # Fail closed: the jobs below skip only on a literal 'false'. If this job fails, or does not run
  # (nightly, manual), its outputs are empty and everything runs. A path this list does not name
  # counts as code that can change a page.
  changes:
    name: Changed paths (decides which jobs run)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      pages: ${{ steps.classify.outputs.pages }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit plus its parents: HEAD^1 is the base branch, HEAD^2 the pull request.
          fetch-depth: 2

      - name: Classify the changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          # Not a merge commit → stop here (the step fails, so every job runs).
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null

          # --no-renames: a file moved out of app/ into docs/ still lists its old path.
          # -z: paths with Vietnamese letters arrive as they are, not quoted.
          git diff --name-only -z --no-renames 'HEAD^1' HEAD > "${RUNNER_TEMP}/changed-paths"

          code=false
          pages=false
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            case "${path}" in
              # Documents: read by people and by Claude, never by the app, the build or a test.
              # (Tailwind skips docs/ — resources/css/app.css; .claude/settings.json is config.)
              docs/*|plans/*.md|.claude/*.md|CLAUDE.md|README.md|LICENSE)
                ;;
              # The local wrapper around the admin a11y scan lives with the files `cwv` runs.
              scripts/admin-preview/*)
                code=true
                pages=true
                ;;
              # Code no page is rendered from: the four Pest suites (`cwv` runs tests/Tools only)
              # and the host-side Python and shell tools.
              tests/Unit/*|tests/Feature/*|tests/Arch/*|tests/Concurrency/*|scripts/*.py|scripts/*.sh)
                code=true
                ;;
              *)
                code=true
                pages=true
                ;;
            esac
          done < "${RUNNER_TEMP}/changed-paths"

          # No changed path at all is not "documents only".
          if [ "${count}" -eq 0 ]; then
            code=true
            pages=true
          fi

          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "pages=${pages}" >> "${GITHUB_OUTPUT}"

          if [ "${code}" = false ]; then
            verdict="Documents only (${count} paths): guardrails, frontend build and page checks are not needed."
          elif [ "${pages}" = false ]; then
            verdict="Code that renders no page (${count} paths): guardrails and frontend build run, page checks are not needed."
          else
            verdict="Code (${count} paths): every job runs."
          fi
          echo "${verdict}"
          echo "${verdict}" >> "${GITHUB_STEP_SUMMARY}"

  guardrails:
    name: Guardrails (pint · phpstan · pest · migrate)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bswebsaas
          POSTGRES_USER: bsweb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsweb -d bswebsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # CI talks to Postgres directly (no PgBouncer). RUNTIME/tests connect as the
      # restricted app_user so RLS is enforced; migrations use the privileged role.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bswebsaas
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 5432
      DB_ADMIN_USERNAME: bsweb
      DB_ADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd, pcntl, sodium, pdo_sqlite, sqlite3
          # Mirror docker/frankenphp/conf.d/app.ini so the runtime matches dev/prod: the browser-upload
          # ceiling stays at/above the 10MB media cap (UploadMediaTest guards this — stock 2M/8M fall below).
          ini-values: upload_max_filesize=12M, post_max_size=16M, memory_limit=256M
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (PostgreSQL + extensions + restricted app role)
        run: php artisan migrate --database=pgsql_admin --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Every language file carries exactly en.json's keys (lang/README.md): a key added in one
      # language only would otherwise show English — or the raw key — to the others.
      - name: Translations (same keys in every language)
        run: php artisan lang:check

      # One process runs every suite, and its memory grows with the test count (the run died at
      # 256M near 1190 tests). The limit is raised for this step only; composer qa matches it.
      - name: Pest (unit · feature · arch · query-budget)
        run: php -d memory_limit=512M vendor/bin/pest

  frontend:
    name: Frontend build (Vite + Tailwind)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit plus its base parent: the legacy-token check diffs against HEAD^1.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build assets (Vite + Tailwind 4)
        run: pnpm run build

      # Gate the admin design tokens at WCAG AA: reads the token values straight from the CSS and
      # fails if any checked text/border/focus pair drops below its threshold. Pure Node, no deps.
      - name: Contrast tokens (WCAG AA)
        run: node scripts/contrast-check.mjs

      # New lines in resources/ and module Blade must use the standard token names
      # (docs/notes/design-tokens.md §7); lines already on main are left to move over as touched.
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - name: No old token names in new lines
        if: github.event_name == 'pull_request'
        run: node scripts/check-legacy-tokens.mjs HEAD^1

  cwv:
    name: Core Web Vitals + a11y (Lighthouse · axe)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.pages != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bswebsaas
          POSTGRES_USER: bsweb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsweb -d bswebsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bswebsaas
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 5432
      DB_ADMIN_USERNAME: bsweb
      DB_ADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      # phpunit.xml sets these for the Pest run in `guardrails`; this job calls `artisan`
      # commands directly (no Pest), so the fail-closed guards (PepperedArgon2IdHasher,
      # SecretCipher) need their own values here. Same test-only strings phpunit.xml uses,
      # not secrets.
      AUTH_PASSWORD_PEPPER: test-only-pepper-not-a-secret
      SETTINGS_ENCRYPTION_KEY: test-only-settings-key-32bytes!!
      CWV_HOST: cwv-ci.test
      CWV_PORT: 8099

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd, pcntl, sodium
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build assets (Vite + Tailwind 4)
        run: pnpm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (PostgreSQL + extensions + restricted app role)
        run: php artisan migrate --database=pgsql_admin --force

      # A fresh site with nothing else on it — real published storefront HTML (homepage +
      # contact page), not a fixture that has to be kept in sync with An Vinh's business
      # content model. Owner auto-generated (--no-interaction skips the secret prompt).
      - name: Provision a measurement-only site
        run: |
          php artisan site:provision \
            --name="CWV CI" \
            --host="${CWV_HOST}" \
            --owner-email="cwv-ci@example.test" \
            --no-interaction

      # Chrome (via Lighthouse/axe) resolves this by real hostname, same as production —
      # no Host-header spoofing needed, and the multi-tenant domain resolver sees a real domain.
      - name: Map the CI hostname to localhost
        run: echo "127.0.0.1 ${CWV_HOST}" | sudo tee -a /etc/hosts

      # One authoritative source for BOTH binaries, matched to each other by construction.
      # The alternative — trusting the runner's preinstalled Chrome to line up with whatever
      # version the `chromedriver` npm package (an @axe-core/cli dependency) happens to fetch
      # at install time — is exactly the kind of silent version-skew that breaks Selenium with
      # "session not created" on some future runner image, for reasons nothing here would explain.
      - name: Install a Chrome + matching chromedriver pair
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      # Self-contained: lhci boots `php artisan serve`, waits for it, runs Lighthouse 3x,
      # asserts against .lighthouserc.cjs, then stops the server. LCP ≤ 1.5s and JS ≤ 30KB
      # FAIL the job (calibrated 24/09 on 18 real samples — see that file); the overall
      # performance score only warns.
      - name: Lighthouse CI (performance + LCP + JS budget)
        run: pnpm exec lhci autorun --collect.chromePath="${{ steps.chrome.outputs.chrome-path }}"

      # The numbers the "warn" thresholds must be calibrated against, printed where they cannot
      # be lost: the log + the run's job summary. The artifact below is best-effort — when the
      # repo's artifact-storage quota is exhausted it uploads nothing (seen on every run 23/09),
      # which left no real measurement anywhere. Plain node, no extra dependency.
      - name: Print Lighthouse measurements
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readdirSync, readFileSync } from 'node:fs';

          const dir = '.lighthouseci';
          const files = existsSync(dir) ? readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f)) : [];
          if (files.length === 0) {
            console.log('No Lighthouse reports found — lhci did not produce any run.');
            process.exit(0);
          }

          const rows = files.map((file) => {
            const lhr = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            const metric = (id) => lhr.audits[id]?.numericValue;
            const script = lhr.audits['resource-summary']?.details?.items?.find((item) => item.resourceType === 'script');

            return {
              url: lhr.finalDisplayedUrl ?? lhr.requestedUrl,
              performance: Math.round((lhr.categories.performance?.score ?? 0) * 100),
              lcp_ms: Math.round(metric('largest-contentful-paint') ?? NaN),
              cls: Number((metric('cumulative-layout-shift') ?? NaN).toFixed(3)),
              tbt_ms: Math.round(metric('total-blocking-time') ?? NaN),
              js_bytes: script?.transferSize ?? 0,
            };
          });

          console.table(rows);

          if (process.env.GITHUB_STEP_SUMMARY) {
            const header = '| URL | Perf | LCP (ms) | CLS | TBT (ms) | JS (bytes) |\n|---|---|---|---|---|---|\n';
            const body = rows.map((r) => `| ${r.url} | ${r.performance} | ${r.lcp_ms} | ${r.cls} | ${r.tbt_ms} | ${r.js_bytes} |`).join('\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Lighthouse measurements\n\n${header}${body}\n`);
          }
          JS

      # "warn"-level assertions print no pass/fail table — the actual numbers (LCP, JS
      # transfer size, performance score) only exist in these JSON reports. Without this,
      # every run's real measurements are written to disk and then thrown away.
      #
      # include-hidden-files is required: upload-artifact@v4 silently skips any dot-prefixed
      # path (lhci's own output dir is `.lighthouseci`) and just logs a warning, not a failure
      # — the first real run "succeeded" while uploading nothing. Confirmed empirically (0
      # artifacts on that run) before adding this, not assumed from the docs alone.
      # continue-on-error: this step's ONE job is to hand a human the real numbers behind
      # the assertions above — it must never be why the job goes red. Learned the
      # hard way: a repo-level artifact-storage-quota hit turned this into a hard failure
      # on a run where lhci itself, the code, and every assertion were fine.
      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7

      - name: Boot a server for the axe pass
        run: |
          php artisan serve --host=0.0.0.0 --port="${CWV_PORT}" &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null "http://${CWV_HOST}:${CWV_PORT}/" && break
            sleep 1
          done

      # axe-core is stricter than Lighthouse's built-in a11y category (full WCAG ruleset).
      # A gate since 24/09 on all three measured pages: the home baseline was clean five runs in a
      # row; widening to /lien-he + /tin-tuc surfaced one real failure (.category__empty contrast,
      # fixed de81d6b), clean on every run since. A WCAG2A/AA violation fails the job (--exit).
      - name: axe accessibility scan
        run: >-
          pnpm exec axe "http://${CWV_HOST}:${CWV_PORT}/" "http://${CWV_HOST}:${CWV_PORT}/lien-he" "http://${CWV_HOST}:${CWV_PORT}/tin-tuc"
          --tags wcag2a,wcag2aa
          --chrome-path="${{ steps.chrome.outputs.chrome-path }}"
          --chromedriver-path="${{ steps.chrome.outputs.chromedriver-path }}"
          --chrome-options="--headless=new,--no-sandbox"
          --exit

      # Admin a11y: render the admin screens as a seeded owner (no login, no 2FA, no real env —
      # tests/Tools/RenderAdminPreviewTest.php) and gate them on STRUCTURAL WCAG 2A/2AA with axe in
      # jsdom (dashboard, content list, email settings, kit + revealed modal; light and dark). Colour
      # contrast is the frontend job's contrast-check.mjs — disabled here. Known naming/label debt
      # lives in scripts/admin-preview/axe-allowlist.json; a NEW structural violation fails the job.
      - name: Render admin screens (no login)
        run: php artisan test tests/Tools/RenderAdminPreviewTest.php

      - name: Admin a11y (axe · structural WCAG 2A/2AA)
        run: node scripts/admin-preview/axe.mjs

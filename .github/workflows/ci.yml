name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26 from 19/10/2026,
# which would change the OS under every job (chrome, setup-php, postgres service) in one silent
# jump. Move the pin deliberately, in its own commit, once a run on the new image is green.
jobs:
  guardrails:
    name: Guardrails (pint · phpstan · pest · migrate)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bswebsaas
          POSTGRES_USER: bsweb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsweb -d bswebsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # CI talks to Postgres directly (no PgBouncer). RUNTIME/tests connect as the
      # restricted app_user so RLS is enforced; migrations use the privileged role.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bswebsaas
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 5432
      DB_ADMIN_USERNAME: bsweb
      DB_ADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd, pcntl, sodium, pdo_sqlite, sqlite3
          # Mirror docker/frankenphp/conf.d/app.ini so the runtime matches dev/prod: the browser-upload
          # ceiling stays at/above the 10MB media cap (UploadMediaTest guards this — stock 2M/8M fall below).
          ini-values: upload_max_filesize=12M, post_max_size=16M, memory_limit=256M
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (PostgreSQL + extensions + restricted app role)
        run: php artisan migrate --database=pgsql_admin --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # Every language file carries exactly en.json's keys (lang/README.md): a key added in one
      # language only would otherwise show English — or the raw key — to the others.
      - name: Translations (same keys in every language)
        run: php artisan lang:check

      - name: Pest (unit · feature · arch · query-budget)
        run: vendor/bin/pest

  frontend:
    name: Frontend build (Vite + Tailwind)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build assets (Vite + Tailwind 4)
        run: pnpm run build

  cwv:
    name: Core Web Vitals + a11y (Lighthouse · axe)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bswebsaas
          POSTGRES_USER: bsweb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsweb -d bswebsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bswebsaas
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 5432
      DB_ADMIN_USERNAME: bsweb
      DB_ADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      # phpunit.xml sets these for the Pest run in `guardrails`; this job calls `artisan`
      # commands directly (no Pest), so the fail-closed guards (PepperedArgon2IdHasher,
      # SecretCipher) need their own values here. Same test-only strings phpunit.xml uses,
      # not secrets.
      AUTH_PASSWORD_PEPPER: test-only-pepper-not-a-secret
      SETTINGS_ENCRYPTION_KEY: test-only-settings-key-32bytes!!
      CWV_HOST: cwv-ci.test
      CWV_PORT: 8099

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd, pcntl, sodium
          coverage: none
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build assets (Vite + Tailwind 4)
        run: pnpm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (PostgreSQL + extensions + restricted app role)
        run: php artisan migrate --database=pgsql_admin --force

      # A fresh site with nothing else on it — real published storefront HTML (homepage +
      # contact page), not a fixture that has to be kept in sync with An Vinh's business
      # content model. Owner auto-generated (--no-interaction skips the secret prompt).
      - name: Provision a measurement-only site
        run: |
          php artisan site:provision \
            --name="CWV CI" \
            --host="${CWV_HOST}" \
            --owner-email="cwv-ci@example.test" \
            --no-interaction

      # Chrome (via Lighthouse/axe) resolves this by real hostname, same as production —
      # no Host-header spoofing needed, and the multi-tenant domain resolver sees a real domain.
      - name: Map the CI hostname to localhost
        run: echo "127.0.0.1 ${CWV_HOST}" | sudo tee -a /etc/hosts

      # One authoritative source for BOTH binaries, matched to each other by construction.
      # The alternative — trusting the runner's preinstalled Chrome to line up with whatever
      # version the `chromedriver` npm package (an @axe-core/cli dependency) happens to fetch
      # at install time — is exactly the kind of silent version-skew that breaks Selenium with
      # "session not created" on some future runner image, for reasons nothing here would explain.
      - name: Install a Chrome + matching chromedriver pair
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      # Self-contained: lhci boots `php artisan serve`, waits for it, runs Lighthouse 3x,
      # asserts against .lighthouserc.cjs, then stops the server. LCP ≤ 1.5s and JS ≤ 30KB
      # FAIL the job (calibrated 24/09 on 18 real samples — see that file); the overall
      # performance score only warns.
      - name: Lighthouse CI (performance + LCP + JS budget)
        run: pnpm exec lhci autorun --collect.chromePath="${{ steps.chrome.outputs.chrome-path }}"

      # The numbers the "warn" thresholds must be calibrated against, printed where they cannot
      # be lost: the log + the run's job summary. The artifact below is best-effort — when the
      # repo's artifact-storage quota is exhausted it uploads nothing (seen on every run 23/09),
      # which left no real measurement anywhere. Plain node, no extra dependency.
      - name: Print Lighthouse measurements
        if: always()
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readdirSync, readFileSync } from 'node:fs';

          const dir = '.lighthouseci';
          const files = existsSync(dir) ? readdirSync(dir).filter((f) => /^lhr-.*\.json$/.test(f)) : [];
          if (files.length === 0) {
            console.log('No Lighthouse reports found — lhci did not produce any run.');
            process.exit(0);
          }

          const rows = files.map((file) => {
            const lhr = JSON.parse(readFileSync(`${dir}/${file}`, 'utf8'));
            const metric = (id) => lhr.audits[id]?.numericValue;
            const script = lhr.audits['resource-summary']?.details?.items?.find((item) => item.resourceType === 'script');

            return {
              url: lhr.finalDisplayedUrl ?? lhr.requestedUrl,
              performance: Math.round((lhr.categories.performance?.score ?? 0) * 100),
              lcp_ms: Math.round(metric('largest-contentful-paint') ?? NaN),
              cls: Number((metric('cumulative-layout-shift') ?? NaN).toFixed(3)),
              tbt_ms: Math.round(metric('total-blocking-time') ?? NaN),
              js_bytes: script?.transferSize ?? 0,
            };
          });

          console.table(rows);

          if (process.env.GITHUB_STEP_SUMMARY) {
            const header = '| URL | Perf | LCP (ms) | CLS | TBT (ms) | JS (bytes) |\n|---|---|---|---|---|---|\n';
            const body = rows.map((r) => `| ${r.url} | ${r.performance} | ${r.lcp_ms} | ${r.cls} | ${r.tbt_ms} | ${r.js_bytes} |`).join('\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Lighthouse measurements\n\n${header}${body}\n`);
          }
          JS

      # "warn"-level assertions print no pass/fail table — the actual numbers (LCP, JS
      # transfer size, performance score) only exist in these JSON reports. Without this,
      # every run's real measurements are written to disk and then thrown away.
      #
      # include-hidden-files is required: upload-artifact@v4 silently skips any dot-prefixed
      # path (lhci's own output dir is `.lighthouseci`) and just logs a warning, not a failure
      # — the first real run "succeeded" while uploading nothing. Confirmed empirically (0
      # artifacts on that run) before adding this, not assumed from the docs alone.
      # continue-on-error: this step's ONE job is to hand a human the real numbers behind
      # the assertions above — it must never be why the job goes red. Learned the
      # hard way: a repo-level artifact-storage-quota hit turned this into a hard failure
      # on a run where lhci itself, the code, and every assertion were fine.
      - name: Upload Lighthouse reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7

      - name: Boot a server for the axe pass
        run: |
          php artisan serve --host=0.0.0.0 --port="${CWV_PORT}" &
          for i in $(seq 1 15); do
            curl -sf -o /dev/null "http://${CWV_HOST}:${CWV_PORT}/" && break
            sleep 1
          done

      # axe-core is stricter than Lighthouse's built-in a11y category (full WCAG ruleset).
      # A gate since 24/09 on all three measured pages: the home baseline was clean five runs in a
      # row; widening to /lien-he + /tin-tuc surfaced one real failure (.category__empty contrast,
      # fixed de81d6b), clean on every run since. A WCAG2A/AA violation fails the job (--exit).
      - name: axe accessibility scan
        run: >-
          pnpm exec axe "http://${CWV_HOST}:${CWV_PORT}/" "http://${CWV_HOST}:${CWV_PORT}/lien-he" "http://${CWV_HOST}:${CWV_PORT}/tin-tuc"
          --tags wcag2a,wcag2aa
          --chrome-path="${{ steps.chrome.outputs.chrome-path }}"
          --chromedriver-path="${{ steps.chrome.outputs.chromedriver-path }}"
          --chrome-options="--headless=new,--no-sandbox"
          --exit

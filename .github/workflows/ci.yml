name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails (pint · phpstan · pest · migrate)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bswebsaas
          POSTGRES_USER: bsweb
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsweb -d bswebsaas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # CI talks to Postgres directly (no PgBouncer). RUNTIME/tests connect as the
      # restricted app_user so RLS is enforced; migrations use the privileged role.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: bswebsaas
      DB_USERNAME: app_user
      DB_PASSWORD: app_secret
      DB_ADMIN_HOST: 127.0.0.1
      DB_ADMIN_PORT: 5432
      DB_ADMIN_USERNAME: bsweb
      DB_ADMIN_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, bcmath, gd, pcntl, sodium, pdo_sqlite, sqlite3
          # Mirror docker/frankenphp/conf.d/app.ini so the runtime matches dev/prod: the browser-upload
          # ceiling stays at/above the 10MB media cap (UploadMediaTest guards this — stock 2M/8M fall below).
          ini-values: upload_max_filesize=12M, post_max_size=16M, memory_limit=256M
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (PostgreSQL + extensions + restricted app role)
        run: php artisan migrate --database=pgsql_admin --force

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan max)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest (unit · feature · arch · query-budget)
        run: vendor/bin/pest

  frontend:
    name: Frontend build (Vite + Tailwind)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build assets (Vite + Tailwind 4)
        run: pnpm run build

; PHP runtime limits for the app image (FrankenPHP/Octane).
; The stock PHP defaults (upload_max_filesize=2M, post_max_size=8M) are BELOW the media
; library's 10MB cap (UploadMedia::MAX_KB) — so a browser upload over 2M is truncated by the
; SAPI before Livewire ever sees it, surfacing as a misleading "no file chosen" error. Align the
; ceiling with the app cap + Livewire's 12MB temporary-upload limit so the friendly app-level
; validation is the gate, not a silent SAPI rejection. (UploadMediaTest guards this invariant.)
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M

; pcov ships in the image for mutation testing (Infection) but stays OFF by default —
; prod shares this image, and a disabled pcov is zero-overhead. Coverage runs opt in
; per-process with `-d pcov.enabled=1`.
pcov.enabled = 0

name: bsweb-dev

# Dev sandbox stack (project bsweb-dev). The production stack lives in
# docker-compose.prod.yml (project bsweb-prod) and is selected on the prod host via
# COMPOSE_FILE in its .env — these two never share a project, network, volume or DB.
#
# All host port mappings bind 127.0.0.1 ONLY: on a public server the DB / Valkey /
# Octane-admin must never be reachable from the internet (the creds here are weak and
# committed). Reach them from the server itself, or tunnel over SSH. Inter-container
# traffic uses service names (postgres/pgbouncer/valkey), unaffected by this binding.

services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    image: bsweb/app:dev
    container_name: bsweb_dev_app
    restart: unless-stopped
    command: >-
      php artisan octane:start
      --server=frankenphp
      --host=0.0.0.0
      --port=80
      --admin-port=2019
      --workers=4
      --max-requests=500
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy

  horizon:
    image: bsweb/app:dev
    container_name: bsweb_dev_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    # A queue worker, not a web server: the image's healthcheck curls Caddy admin :2019, which
    # always fails here. `horizon:status` exits non-zero when the supervisor is down.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # In-process scheduler (php artisan schedule:work) — runs the daily media:purge-trash job.
  # A long-running loop, so no host crontab is needed; restart-on-exit keeps it alive.
  scheduler:
    image: bsweb/app:dev
    container_name: bsweb_dev_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy
    # Not a web server either: without this the image's Caddy healthcheck shows a false "unhealthy".
    healthcheck:
      disable: true

  postgres:
    image: pgvector/pgvector:pg17
    container_name: bsweb_dev_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: bswebsaas
      POSTGRES_USER: bsweb
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsweb -d bswebsaas"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    # PgBouncer 1.25.2, pinned by digest: `:latest` would move on the next pull.
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd
    container_name: bsweb_dev_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: app_user
      DB_PASSWORD: app_secret
      DB_NAME: bswebsaas
      # D14: transaction pooling — Gate #1 will prove tenant/prepared-statement isolation
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # Allow server-side prepared statements to survive transaction pooling (D14)
      MAX_PREPARED_STATEMENTS: "200"
      LISTEN_PORT: "6432"
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: bsweb_dev_valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  valkeydata:

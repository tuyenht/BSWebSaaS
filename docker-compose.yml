name: bsweb-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    image: bsweb/app:dev
    container_name: bsweb_dev_app
    restart: unless-stopped
    command: >-
      php artisan octane:start
      --server=frankenphp
      --host=0.0.0.0
      --port=80
      --admin-port=2019
      --workers=4
      --max-requests=500
    ports:
      - "8080:80"
      - "2019:2019"
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy

  horizon:
    image: bsweb/app:dev
    container_name: bsweb_dev_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_started
      valkey:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    container_name: bsweb_dev_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: bswebsaas
      POSTGRES_USER: bsweb
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsweb -d bswebsaas"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: bsweb_dev_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bsweb
      DB_PASSWORD: secret
      DB_NAME: bswebsaas
      # D14: transaction pooling — Gate #1 will prove tenant/prepared-statement isolation
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # Allow server-side prepared statements to survive transaction pooling (D14)
      MAX_PREPARED_STATEMENTS: "200"
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: bsweb_dev_valkey
    restart: unless-stopped
    command: valkey-server --save 60 1 --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  valkeydata:
